name: Live capacity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Observe unrelated hosted jobs with the real read-only PAT
        env:
          OBSERVER_TOKEN: ${{ secrets.PACKAGES_OBSERVER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from ci import dispatch
          token = os.environ['OBSERVER_TOKEN']
          before = dispatch.api('rate_limit', token=token)['resources']['core']
          original = dispatch.api
          calls = []
          def measured(path, *args, **kwargs):
              calls.append(path)
              return original(path, *args, **kwargs)
          dispatch.api = measured
          started = time.monotonic()
          free, occupied = dispatch.capacity()
          elapsed = time.monotonic() - started
          dispatch.api = original
          after = original('rate_limit', token=token)['resources']['core']
          print(json.dumps(dict(capacity_rest_calls=len(calls), endpoints=calls, elapsed_seconds=elapsed,
              observer_core_before=before, observer_core_after=after,
              rate_limit_note='The shared PAT delta may include concurrent controller reads.'), sort_keys=True))
          facts = [dict(repository=repo, job=job, **value) for (repo, job), value in occupied.items()]
          print(json.dumps(dict(free_before_headroom=free, occupied=facts), sort_keys=True))
          unrelated = [item for item in facts if item['repository'] == 'demo-side' and item['name'].startswith('occupy (')]
          assert len(unrelated) == 2, 'Expected both bounded unrelated probe jobs to be running'
          PY
