name: One-time sandbox key renewal
run-name: Renew existing sandbox signing key for one year
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: renew
        options: [renew, publish]
permissions:
  contents: read
jobs:
  renew:
    if: github.actor_id == vars.CONTROLLER_APP_BOT_ID && inputs.phase != 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: package-publication
    steps:
      - name: Install standard key-maintenance tools
        run: sudo apt-get update && sudo apt-get install -y gnupg python3-nacl
      - name: Renew the same key and seal its secret directly for GitHub
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          PACKAGES_GPG_FINGERPRINT: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
          SECRET_ENCRYPTION_PUBLIC_KEY: "4fvU9tXvKSOKRt57Ij8zTY+os39EOAwmrSl48CUY0yg="
          SECRET_ENCRYPTION_KEY_ID: "3380204578043523366"
        run: |
          python3 - <<'RENEW'
          import base64,datetime,json,os,subprocess,tempfile
          from pathlib import Path
          from nacl.public import PublicKey,SealedBox
          expected=os.environ['PACKAGES_GPG_FINGERPRINT']; destination=Path(os.environ['RUNNER_TEMP'])/'renewed-public-metadata';destination.mkdir()
          with tempfile.TemporaryDirectory(prefix='renew-key-',dir=os.environ['RUNNER_TEMP']) as temporary:
              root=Path(temporary);root.chmod(0o700);private=root/'private.asc';private.write_text(os.environ.pop('APT_SIGNING_KEY'));private.chmod(0o600)
              home=root/'gnupg';home.mkdir(mode=0o700);gpg=['gpg','--homedir',str(home),'--batch','--no-tty','--pinentry-mode','loopback']
              phrase=os.environ.pop('PACKAGES_GPG_PASSPHRASE','')
              if phrase:
                  path=root/'passphrase';path.write_text(phrase);path.chmod(0o600);gpg+=['--passphrase-file',str(path)]
              subprocess.run(gpg+['--import',str(private)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              before=subprocess.check_output(gpg+['--with-colons','--list-secret-keys'],text=True,stderr=subprocess.PIPE)
              assert [line.split(':')[9] for line in before.splitlines() if line.startswith('fpr:')]==[expected]
              subprocess.run(gpg+['--quick-set-expire',expected,'1y'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              public=subprocess.check_output(gpg+['--armor','--export',expected],stderr=subprocess.PIPE)
              secret=subprocess.check_output(gpg+['--armor','--export-secret-keys',expected],stderr=subprocess.PIPE)
              encrypted=SealedBox(PublicKey(base64.b64decode(os.environ['SECRET_ENCRYPTION_PUBLIC_KEY']))).encrypt(secret)
              (destination/'encrypted-secret.json').write_text(json.dumps({'key_id':os.environ['SECRET_ENCRYPTION_KEY_ID'],'encrypted_value':base64.b64encode(encrypted).decode()}))
              del secret
              (destination/'apt.asc').write_bytes(public)
              after=subprocess.check_output(gpg+['--with-colons','--list-keys'],text=True,stderr=subprocess.PIPE)
              assert [line.split(':')[9] for line in after.splitlines() if line.startswith('fpr:')]==[expected]
              expires=int(next(line for line in after.splitlines() if line.startswith('pub:')).split(':')[6])
              assert 364*86400 < expires-datetime.datetime.now(datetime.timezone.utc).timestamp() < 367*86400
              (destination/'verification.json').write_text(json.dumps({'fingerprint':expected,'expires_utc':datetime.datetime.fromtimestamp(expires,datetime.timezone.utc).isoformat(),'same_key':True,'private_key_export':'only sealed directly to GitHub environment secret encryption key'}))
              subprocess.run(['gpgconf','--homedir',str(home),'--kill','all'],check=True)
          print('Same fingerprint verified; renewed public metadata and GitHub-sealed secret prepared')
          RENEW
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renewed-public-metadata-and-github-sealed-secret
          path: ${{ runner.temp }}/renewed-public-metadata/
          retention-days: 1
          if-no-files-found: error
          overwrite: false
  publish:
    if: github.actor_id == vars.CONTROLLER_APP_BOT_ID && inputs.phase == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: package-publication
    concurrency:
      group: core-ci-feed-${{ vars.FEED_REPOSITORY }}-${{ vars.FEED_BRANCH }}
      cancel-in-progress: false
      queue: max
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CONTROLLER_APP_BOT_ID: ${{ vars.CONTROLLER_APP_BOT_ID }}
      PACKAGES_GPG_FINGERPRINT: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
      FEED_REPOSITORY: ${{ vars.FEED_REPOSITORY }}
      FEED_REPOSITORY_ID: ${{ vars.FEED_REPOSITORY_ID }}
      FEED_BRANCH: ${{ vars.FEED_BRANCH }}
      FEED_WRITER_APP_ID: ${{ vars.FEED_WRITER_APP_ID }}
      FEED_WRITER_INSTALLATION_ID: ${{ vars.FEED_WRITER_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 230e594f78ccf51108cba5db910ea41f87f59876
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ vars.FEED_REPOSITORY }}
          ref: ${{ vars.FEED_BRANCH }}
          path: feed
          persist-credentials: false
      - name: Publish renewed verification metadata
        env:
          PACKAGES_APP_PRIVATE_KEY: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
        run: |
          python3 - <<'PUBLISH'
          import os,shutil,subprocess,tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('tooling/core_ci').resolve()))
          from contract import output,require
          from publish import checked_push,prepare_commit,writer_token
          expected=os.environ['PACKAGES_GPG_FINGERPRINT']; feed=Path('feed').resolve(); renewed=Path('tooling/keys/apt.asc').resolve(); current=feed/'keys/apt.asc'
          require(os.environ['GITHUB_ACTOR_ID']==os.environ['CONTROLLER_APP_BOT_ID'] and os.environ['GITHUB_RUN_ATTEMPT']=='1','operator actor/attempt differs')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP'],prefix='public-key-update-') as temporary:
              root=Path(temporary);root.chmod(0o700)
              for path in (current,renewed):
                  result=output(['gpg','--homedir',str(root),'--batch','--with-colons','--show-keys',str(path)])
                  require([line.split(':')[9] for line in result.splitlines() if line.startswith('fpr:')]==[expected],'public signing identity changed')
              require(current.read_bytes()!=renewed.read_bytes(),'public metadata already updated; no mutation needed')
              shutil.copyfile(renewed,current)
              prepare_commit(feed,['keys/apt.asc'],message='Renew sandbox verification-key validity; unchanged fingerprint')
              private=root/'writer.pem';private.write_text(os.environ.pop('PACKAGES_APP_PRIVATE_KEY'));private.chmod(0o600)
              config={'repository':os.environ['FEED_REPOSITORY'],'repository_id':int(os.environ['FEED_REPOSITORY_ID']),'branch':os.environ['FEED_BRANCH']}
              token=writer_token(private,config)
              revision=checked_push(feed,config['branch'],token)
          print('Renewed public metadata committed:',revision)
          PUBLISH
